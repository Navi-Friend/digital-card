services:
  postgres:
      container_name: postgres_card
      image: postgres:15
      restart: always
      environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB}
      ports:
        - 5433:5432
      volumes:
        - postgres_data:/var/lib/postgresql
      networks:
        - nest-network

volumes:
  postgres_data:

networks:
  nest-network: