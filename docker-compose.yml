services:
    postgres:
        image: postgres:15-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - '5433:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - nest-network

    app:
        build:
            context: .
            target: runner
        restart: unless-stopped
        env_file:
            - .env
        ports:
            - '3000:3000'
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - nest-network

volumes:
    postgres_data:

networks:
    nest-network:
